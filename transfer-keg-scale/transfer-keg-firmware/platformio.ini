[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

lib_deps =
    bogde/HX711@^0.7.5
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
    adafruit/Adafruit SH110X@^2.1.8
    ; ESP8266WiFi, ESP8266WebServer, DNSServer, EEPROM are all built-in to the
    ; espressif8266 Arduino core — no extra lib_deps entries needed.

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D PIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH  ; optional: better AP stability
